name: Radio Discover

# Только вручную: это разведка, а не часть конвейера новостей
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Search stations
        run: python3 radio_discover.py
