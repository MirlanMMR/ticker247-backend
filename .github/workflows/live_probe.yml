name: Когда вещают каналы-кандидаты

# ЗАЧЕМ. Каналы отбирались одним замером в девять вечера, и все, у кого в тот
# час не было эфира, попали в мёртвые. Это неверно: круглосуточность нам не
# нужна — лента показывает то, что идёт сейчас, и канал с дневным вещанием
# будет виден все свои часы. Здесь опрос идёт каждый час и копит расписание.
#
# Стоит ноль: репозиторий открытый, минуты бесплатны, ключ YouTube не нужен —
# страница /@канал/live отвечает и без него.

on:
  workflow_dispatch:
  schedule:
    # На 15-й минуте: сбор новостей идёт в :00 и :30, и наталкиваться на него
    # незачем
    - cron: '15 * * * *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Опрос кандидатов
        run: python probe_live.py

      - name: Сохранить замер
        run: |
          if git diff --quiet live_probe.csv 2>/dev/null; then
            echo "изменений нет"
            exit 0
          fi
          git config user.name  "ticker-probe"
          git config user.email "noreply@github.com"
          git add live_probe.csv
          git commit -m "probe: замер вещания $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Между запусками кто-то мог выложить правки — тогда просто
          # подтягиваем и пробуем снова, а не роняем прогон
          git pull --rebase --autostash origin main || true
          git push origin main || echo "не удалось выложить, замер останется в следующем прогоне"
