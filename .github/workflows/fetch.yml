name: Fetch & AI Filter News

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Учебная тревога: работать через запасного поставщика"
        type: boolean
        default: false
  schedule:
    # ВРЕМЕННО, до 1 сентября 2026: раз в два часа.
    # Прогон стоит ~3,6 минуты, часовой график — 86 минут в сутки, то есть
    # ~2600 в месяц при бесплатных 2000. К 18 августа осталось 197 минут на
    # 15 дней. Двухчасовой график укладывается в остаток.
    # 1 сентября вернуть '0 */1 * * *' — часовой график стоит около $5 в месяц.
    - cron: '0 */2 * * *'  # каждые два часа

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Свой потолок расхода ИИ на месяц, в долларах. Держим ниже остатка
          # на счёте: упершись в него, скрипт перестаёт звать ИИ, но ленту
          # продолжает выпускать на отборе по признакам.
          # Замерено 17.08: прогон стоит $0.011, часовой график — 26 центов в
          # сутки, около $8 в месяц. Потолок $12 оставляет запас и всё равно
          # ловит любую неожиданность задолго до счёта.
          # Учебная тревога: нулевой потолок заставляет скрипт считать, что
          # Gemini недоступен, и уйти к запасному поставщику. Проверять
          # запасной путь в настоящий сбой — худшее время для проверок
          AI_MONTHLY_BUDGET: ${{ inputs.force_fallback && '0' || '12' }}
          # Запасной поставщик. Ключа пока нет — Alibaba держит новый аккаунт
          # под проверкой службы безопасности (ответ обещают за три дня).
          # Без ключа всё работает как раньше, с ключом — Gemini перестаёт быть
          # единственной точкой отказа.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # Поставщик — Groq, а не Alibaba: у Alibaba для ключа требуют
          # привязать карту, а мы после утечки 18.08 решили карт в облаках
          # без нужды не оставлять. У Groq доступ бесплатный и без карты:
          # 30 запросов в минуту, 14 400 в сутки — для запасного пути, который
          # включается лишь когда молчит Gemini, с запасом.
          # Имя переменной осталось историческим.
          QWEN_BASE_URL: "https://api.groq.com/openai/v1"
          QWEN_MODEL: "openai/gpt-oss-120b"
        run: python fetch_news.py

      # Разбор ОПУБЛИКОВАННОЙ ленты по всем четырём пулам. Пользователь читает
      # только русский — испанский, португальский и английский не проверял
      # никто, и все находки приходили из одного пула. Проверка идёт после
      # публикации, не роняет прогон при сбое и ничего не стоит: без ИИ
      - name: Audit published feed
        if: always()
        continue-on-error: true
        run: python feed_audit.py
