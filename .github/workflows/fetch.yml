name: Fetch & AI Filter News

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Учебная тревога: работать через запасного поставщика"
        type: boolean
        default: false
  schedule:
    # Часовой график вернулся 22.08.2026, на неделю раньше срока: минуты
    # Actions стали бесплатными (репозиторий открыт), а прогон стоит 1,9
    # цента — 46 центов в сутки. Ограничение было в минутах, не в деньгах.
    #
    # И это нужно ленте: она стала хронологической, а хронология без свежести
    # бессмысленна — новость двухчасовой давности не должна быть верхней.
    # ДВА запуска в час, а не один. Расписание GitHub Actions — обещание, а
    # не гарантия: замер 27.08.2026 по 38 плановым прогонам дал медиану 59
    # минут, но пять разрывов больше полутора часов и один в 5 ч 14 мин. В ночь
    # на 27-е запуски не состоялись вовсе, и лента стояла девять часов — при
    # том что читателю мы обещаем обновление каждый час.
    #
    # Пропустит GitHub первый запуск — сработает второй. Платить дважды при
    # этом не придётся: скрипт в начале смотрит, когда лента обновлялась, и
    # при свежей выходит сразу (см. _feed_is_fresh).
    - cron: '0 * * * *'
    - cron: '30 * * * *'

# Право на запись нужно одному шагу — тому, что складывает замеры вещания в
# live_probe.csv. Лента живёт в Firebase и репозитория не касается
permissions:
  contents: write

# ОДИН ЦИКЛ НА ВЕСЬ РЕПОЗИТОРИЙ.
#
# Догонялка внизу держит задание часами, и два таких цикла разом означали бы
# двойной расход ИИ и две ленты, спорящие за одну базу. Очередь, а не отмена:
# начатый цикл дороже нового, обрывать его на середине незачем.
concurrency:
  group: ticker-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Ключи и настройки — на уровне ЗАДАНИЯ, а не шага: их нужен и шаг
    # догонялки в конце, а держать тридцать строк в двух местах — вернейший
    # способ развести их со временем
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Свой потолок расхода ИИ на месяц, в долларах. Держим ниже остатка
      # на счёте: упершись в него, скрипт перестаёт звать ИИ, но ленту
      # продолжает выпускать на отборе по признакам.
      # $18, поднят с $15 27.08.2026. Расход после перехода на цепочку
      # извлечения — $0.53 в сутки, то есть около $16 за полный месяц:
      # прежний потолок упёрся бы примерно 28 сентября, и лента доработала
      # бы месяц без ИИ — без перевода и обзоров прессы.
      #
      # ИМЕННО $18, А НЕ $20. Собственный потолок Gemini на счёте — $20.
      # Поставить наш на ту же цифру значит лишить его смысла: он сработал
      # бы ровно тогда, когда Google и так перекрывает доступ. Наш стоп-кран
      # должен срабатывать РАНЬШЕ внешнего — тогда лента выходит без ИИ, но
      # выходит, а в логе появляется предупреждение. Два доллара форы — это
      # время заметить и решить, поднимать ли гугловский потолок.
      # Учебная тревога: нулевой потолок заставляет скрипт считать, что
      # Gemini недоступен, и уйти к запасному поставщику. Проверять
      # запасной путь в настоящий сбой — худшее время для проверок
      AI_MONTHLY_BUDGET: ${{ inputs.force_fallback && '0' || '18' }}
      # Запасной поставщик. Ключа пока нет — Alibaba держит новый аккаунт
      # под проверкой службы безопасности (ответ обещают за три дня).
      # Без ключа всё работает как раньше, с ключом — Gemini перестаёт быть
      # единственной точкой отказа.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      # Поставщик — Groq, а не Alibaba: у Alibaba для ключа требуют
      # привязать карту, а мы после утечки 18.08 решили карт в облаках
      # без нужды не оставлять. У Groq доступ бесплатный и без карты:
      # 30 запросов в минуту, 14 400 в сутки — для запасного пути, который
      # включается лишь когда молчит Gemini, с запасом.
      # Имя переменной осталось историческим.
      # Поставщик — Groq (G-R-O-Q), console.groq.com. Не xAI и не Alibaba:
      # у первого требуют купить кредиты, у второй привязать карту, а
      # запасной путь такой цены не стоит. У Groq доступ бесплатный и без
      # карты: 30 запросов в минуту, 14 400 в сутки.
      # Названия Grok и Groq различаются одной буквой и по-русски звучат
      # одинаково — 22.08 ключ из-за этого был заведён не у того.
      QWEN_BASE_URL: "https://api.groq.com/openai/v1"
      QWEN_MODEL: "openai/gpt-oss-120b"
      # Ручной запуск делает работу всегда, не глядя на свежесть
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Проверки идут ДО прогона: они без сети и ключей, занимают доли секунды,
      # а ломают сборку раньше, чем кривая правка успеет уехать в ленту
      - name: Unit tests
        run: |
          python test_trim.py
          python test_extract.py
          python test_storydedup.py
          python test_feed_gate.py
          python test_live_identity.py

      - name: Run fetch script
        run: python fetch_news.py

      # Разбор ОПУБЛИКОВАННОЙ ленты по всем четырём пулам. Пользователь читает
      # только русский — испанский, португальский и английский не проверял
      # никто, и все находки приходили из одного пула. Проверка идёт после
      # публикации, не роняет прогон при сбое и ничего не стоит: без ИИ
      - name: Audit published feed
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Личный чат владельца для служебных оповещений — НЕ читательский
          # канал. Проверка пишет туда, только когда замечаний заметно больше
          # обычного: сообщение «всё как всегда» двадцать четыре раза в сутки
          # перестанут читать ровно к тому дню, когда оно окажется важным.
          # Нет секрета — проверка молчит и работает дальше.
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
        run: python feed_audit.py

      # ОПРОС КАНАЛОВ-КАНДИДАТОВ ЕДЕТ ЗДЕСЬ, А НЕ СВОИМ РАСПИСАНИЕМ.
      #
      # Своим прогоном он ходил час, и за ночь с 28 на 29.08 прошло три
      # замера вместо восьми: расписание в Actions — пожелание, а не
      # обещание, бесплатные прогоны запускают, когда свободно. Для
      # расписания вещания это беда: дыры в шесть часов не отличить от
      # «канал в это время молчал».
      #
      # Этот прогон ходит каждые полчаса и по делу, поэтому идёт ровно.
      # Замер к нему прицепом: ключей не просит, минут почти не ест,
      # ошибку глотает и ленту не роняет.
      - name: Опрос каналов-кандидатов
        if: always()
        continue-on-error: true
        run: python probe_live.py

      - name: Сохранить замер
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "ticker-probe"
          git config user.email "noreply@github.com"
          git add live_probe.csv
          git diff --cached --quiet && { echo "изменений нет"; exit 0; }
          git commit -m "probe: замер вещания $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Между прогонами кто-то мог выложить правки — подтягиваем и
          # пробуем снова, а не роняем ленту из-за журнала замеров
          git pull --rebase --autostash origin main || true
          git push origin main || echo "не выложилось, замер уйдёт следующим"

      # ─── ДОГОНЯЛКА: ВЫПУСКАЕМ ЛЕНТУ ВСЕ ПЯТЬ С ПОЛОВИНОЙ ЧАСОВ ───────────
      #
      # ЗАЧЕМ. Расписание GitHub Actions — пожелание, а не обещание. Замер
      # 30.08.2026: за сутки прошло 13 прогонов вместо 48, средний промежуток
      # 102 минуты, самая большая дыра 5 часов 16 минут. Запуски идут парами и
      # потом надолго замолкают. А читателю мы обещаем обновление КАЖДЫЙ ЧАС —
      # и в описании в магазине, и голосом в радиоблоке.
      #
      # ПОЧЕМУ ЦИКЛОМ ВНУТРИ ЗАДАНИЯ, А НЕ ВНЕШНИМ БУДИЛЬНИКОМ. Самый надёжный
      # способ — сторонняя служба, дёргающая GitHub по вебхуку, но для этого
      # нужен личный токен в секретах. И самозапуск через `gh workflow run`
      # тоже не годится: события, посланные встроенным токеном, новых прогонов
      # НЕ создают — так GitHub защищается от бесконечных цепочек.
      #
      # Зато одно задание вправе работать до шести часов. Значит, каждое
      # срабатывание расписания покрывает собой полсуток работы: пять проходов
      # по часу. Даже нынешние 13 запусков в сутки перекрывают круглые сутки с
      # большим запасом.
      #
      # ЧАС, А НЕ ПОЛЧАСА. Замер 30.08 по всем пулам: за час приходит около
      # девяти новостей на пул — примерно 15% ленты, остальное остаётся.
      # Лента живёт скользящим окном в сутки, и прогон досыпает свежее, а не
      # заменяет всё.
      #
      # Значит, ценность частых проходов не в объёме, а в задержке: за два
      # часа придёт ровно столько же новостей, разница лишь в том, увидит ли
      # читатель новость возрастом до часа или до двух. А платим мы ЗА
      # ПРОХОД, а не за новость: при получасовом шаге каждый приносил
      # четыре-пять штук и стоил те же три цента.
      #
      # Час выполняет наше обещание буквально («обновление каждый час») и
      # вдвое дешевле: около $22 в месяц вместо $43 при потолке $18.
      #
      # Минуты для открытого репозитория бесплатны, так что цена — ноль.
      #
      # Ошибку глотаем: упавший проход не должен обрывать остальные.
      - name: Догонялка — лента каждые полчаса
        if: always()
        continue-on-error: true
        timeout-minutes: 340
        run: |
          for i in $(seq 1 5); do
            sleep 3540
            echo "── проход $i из 5 ──"
            python fetch_news.py || echo "проход $i: лента не собралась"
            python feed_audit.py || true
            python probe_live.py || true
            git add live_probe.csv
            if ! git diff --cached --quiet; then
              git commit -m "probe: замер вещания $(date -u '+%Y-%m-%d %H:%M') UTC"
              git pull --rebase --autostash origin main || true
              git push origin main || echo "не выложилось, замер уйдёт следующим"
            fi
          done
