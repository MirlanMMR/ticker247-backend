name: Fetch & AI Filter News

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Учебная тревога: работать через запасного поставщика"
        type: boolean
        default: false
      pools:
        description: "Какие пулы обновить (ru,en,es,pt,fr через запятую); пусто — все"
        type: string
        default: ""
  schedule:
    # РАСПИСАНИЕ ПО ЧАСОВЫМ ПОЯСАМ ЧИТАТЕЛЕЙ (09.10.2026, решение владельца).
    #
    # Раньше стояло «раз в два часа, все пулы разом», а на деле выходило ~4 запуска в сутки
    # с дырами до 11 часов: GitHub пропускает плановые запуски, а задание держалось 105
    # минут (20 минут разбор + 70 минут холостого «дозора»), и очередь, в которой ждать
    # может только один запуск, отменяла следующие. Читатель в Бишкеке просыпался к ленте
    # двенадцатичасовой давности, а вся лента с 06:00 сводилась к одной карточке.
    #
    # Теперь каждый пул обновляется трижды в сутки по СВОЕМУ местному времени — около
    # 9:00, 13:00 и 17:00 — и только он один (POOLS, fetch_news.py): запуск стоит в 3–5 раз
    # дешевле полного. Таблица слотов — в schedule_pools.py; строки ниже должны с ней
    # совпадать, это проверяет test_schedule.py (ошибёшься — тесты не дадут запустить).
    #
    # Каждый слот стоит ДВАЖДЫ: :07 и :37. Расписание GitHub ненадёжно, и запасной запуск
    # видит свежую ленту (шлюз FRESH_ENOUGH_MIN) и выходит, ничего не потратив. Минуты
    # нечётные нарочно: запуски ровно в :00 GitHub задерживает сильнее всего.
    #
    # Дозор срочного вынесен в patrol.yml и идёт КРУГЛОСУТОЧНО, независимо от разбора.
    - cron: '7 3 * * *'   # ru
    - cron: '37 3 * * *'   # ru
    - cron: '7 7 * * *'   # ru, fr
    - cron: '37 7 * * *'   # ru, fr
    - cron: '7 11 * * *'   # ru, fr
    - cron: '37 11 * * *'   # ru, fr
    - cron: '7 12 * * *'   # pt
    - cron: '37 12 * * *'   # pt
    - cron: '7 13 * * *'   # en
    - cron: '37 13 * * *'   # en
    - cron: '7 15 * * *'   # es, fr
    - cron: '37 15 * * *'   # es, fr
    - cron: '7 16 * * *'   # pt
    - cron: '37 16 * * *'   # pt
    - cron: '7 17 * * *'   # en
    - cron: '37 17 * * *'   # en
    - cron: '7 19 * * *'   # es
    - cron: '37 19 * * *'   # es
    - cron: '7 20 * * *'   # pt
    - cron: '37 20 * * *'   # pt
    - cron: '7 21 * * *'   # en
    - cron: '37 21 * * *'   # en
    - cron: '7 23 * * *'   # es
    - cron: '37 23 * * *'   # es

# Право на запись нужно одному шагу — тому, что складывает замеры вещания в
# live_probe.csv. Лента живёт в Firebase и репозитория не касается
permissions:
  contents: write

# ОДИН ЦИКЛ НА ВЕСЬ РЕПОЗИТОРИЙ.
#
# Два задания разом означали бы двойной расход ИИ и две ленты, спорящие за
# одну базу. Очередь, а не отмена: начатый цикл дороже нового.
#
# ВАЖНО ПРО ОЧЕРЕДЬ. У GitHub она на группу ОДНА: пока задание идёт, ждать
# может только один запуск, и каждый следующий убивает предыдущего
# ожидающего. Пока задание длилось пять часов при запусках раз в полчаса,
# это давало десять отмен в сутки. Теперь задание короче шага расписания, и
# очередь не образуется вовсе — но правило остаётся в силе, и удлинять
# задание сверх двух часов нельзя, иначе отмены вернутся.
concurrency:
  group: ticker-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Разбор одного-двух пулов занимает ~25 минут; час — предел, чтобы очередь не копилась
    timeout-minutes: 60
    # Ключи и настройки — на уровне ЗАДАНИЯ, а не шага: их нужен и дозор
    # в конце, а держать тридцать строк в двух местах — вернейший способ
    # развести их со временем
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Свой потолок расхода ИИ на месяц, в долларах. Держим ниже остатка
      # на счёте: упершись в него, скрипт перестаёт звать ИИ, но ленту
      # продолжает выпускать на отборе по признакам.
      # $18, поднят с $15 27.08.2026. Расход после перехода на цепочку
      # извлечения — $0.53 в сутки, то есть около $16 за полный месяц:
      # прежний потолок упёрся бы примерно 28 сентября, и лента доработала
      # бы месяц без ИИ — без перевода и обзоров прессы.
      #
      # ИМЕННО $18, А НЕ $20. Собственный потолок Gemini на счёте — $20.
      # Поставить наш на ту же цифру значит лишить его смысла: он сработал
      # бы ровно тогда, когда Google и так перекрывает доступ. Наш стоп-кран
      # должен срабатывать РАНЬШЕ внешнего — тогда лента выходит без ИИ, но
      # выходит, а в логе появляется предупреждение. Два доллара форы — это
      # время заметить и решить, поднимать ли гугловский потолок.
      # Учебная тревога: нулевой потолок заставляет скрипт считать, что
      # Gemini недоступен, и уйти к запасному поставщику. Проверять
      # запасной путь в настоящий сбой — худшее время для проверок
      # ⚠️ ЦИФРА В НАШИХ ЕДИНИЦАХ, А ОНИ ПРИМЕРНО ВСЕМЕРО МЕНЬШЕ НАСТОЯЩИХ.
      #
      # 31.08 Google перекрыл доступ: предел $50 за август исчерпан. Наш
      # счётчик показывал при этом $5.00 за ТОТ ЖЕ месяц — то есть стоп-кран
      # не сработал бы вовсе.
      #
      # Откуда взялся множитель. Из тех $50 примерно $12–14 — не наш расход, а
      # кража ключа 18.08; ещё часть съели лишние прогоны, которых больше не
      # будет. По делу вышло около $35 против наших $5 — отсюда «всемеро».
      # Множитель прикидочный: часть разницы объясняется потерянными
      # прогонами (см. flush_ai_spend), часть, возможно, ценой модели.
      #
      # 15.09.2026: внутренний счётчик за сентябрь показал ~$2 и остановил ИИ,
      # а у Google за тот же месяц было $7.84 при лимите $25 и $3.71 на счету.
      # Множитель «7–10×» из августа завышал страх. Ставим 20 — ниже гугловских
      # $25, с запасом, чтобы перевод непустых пулов (ru/es/pt/fr) не срывался.
      # 24.09.2026 — $40 (решение владельца). Настоящая цена выяснилась: весь
      # месяц отвечала Gemini 3.1 Flash-Lite, а счётчик считал по 2.5 —
      # занижал в 2,5 раза. Честно: ~$0.95/сутки без редактора, ~$30–35/мес.
      # ⚠️ Лимит в самом Google AI Studio должен быть ВЫШЕ $40 (~$45), иначе
      # Google отключит ИИ раньше нашего потолка.
      AI_MONTHLY_BUDGET: ${{ inputs.force_fallback && '0' || '50' }}
      # Выпускающий редактор (editor.py): shadow — отчёт без правки ленты,
      # live — в эфире, off — выключен. Тень — два-три прогона, не дольше
      EDITOR_MODE: live
      # Запасной поставщик. Ключа пока нет — Alibaba держит новый аккаунт
      # под проверкой службы безопасности (ответ обещают за три дня).
      # Без ключа всё работает как раньше, с ключом — Gemini перестаёт быть
      # единственной точкой отказа.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      # Поставщик — Groq, а не Alibaba: у Alibaba для ключа требуют
      # привязать карту, а мы после утечки 18.08 решили карт в облаках
      # без нужды не оставлять. У Groq доступ бесплатный и без карты:
      # 30 запросов в минуту, 14 400 в сутки — для запасного пути, который
      # включается лишь когда молчит Gemini, с запасом.
      # Имя переменной осталось историческим.
      # Поставщик — Groq (G-R-O-Q), console.groq.com. Не xAI и не Alibaba:
      # у первого требуют купить кредиты, у второй привязать карту, а
      # запасной путь такой цены не стоит. У Groq доступ бесплатный и без
      # карты: 30 запросов в минуту, 14 400 в сутки.
      # Названия Grok и Groq различаются одной буквой и по-русски звучат
      # одинаково — 22.08 ключ из-за этого был заведён не у того.
      QWEN_BASE_URL: "https://api.groq.com/openai/v1"
      QWEN_MODEL: "openai/gpt-oss-120b"
      # Ручной запуск делает работу всегда, не глядя на свежесть
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Какие пулы этот запуск обновляет. Плановый запуск берёт пулы своего слота из
      # schedule_pools.py; ручной — из поля «pools» (пусто = все пять и «полки стран»).
      # Незнакомая строка cron — ошибка, а не «все пулы»: молчаливый полный прогон стоил бы
      # в пять раз дороже, а тест test_schedule.py такого и не пропустит.
      - name: Какие пулы обновлять
        env:
          CRON: ${{ github.event.schedule }}
          POOLS_INPUT: ${{ inputs.pools }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            P="$(python schedule_pools.py "$CRON")"
            if [ -z "$P" ]; then
              echo "::error::Строка расписания '$CRON' не найдена в schedule_pools.py"
              exit 1
            fi
            echo "POOLS=$P" >> "$GITHUB_ENV"
            echo "COUNTRY_SHELVES=$(python schedule_pools.py --shelves "$CRON")" >> "$GITHUB_ENV"
          else
            echo "POOLS=$POOLS_INPUT" >> "$GITHUB_ENV"
            if [ -z "$POOLS_INPUT" ]; then echo "COUNTRY_SHELVES=1" >> "$GITHUB_ENV"; fi
          fi
          echo "Пулы запуска: ${P:-$POOLS_INPUT}"

      # Проверки идут ДО прогона: они без сети и ключей, занимают доли секунды,
      # а ломают сборку раньше, чем кривая правка успеет уехать в ленту
      - name: Unit tests
        run: |
          python test_trim.py
          python test_schedule.py
          python test_translate_prompt.py
          python test_patrol_rules.py
          python test_news_sitemap.py
          python test_rules_all_languages.py
          python test_foreign_region.py
          python test_full_text_of.py
          python test_enrich_rule.py
          python test_strip_tail.py
          python test_paragraph_rule.py
          python test_extract.py
          python test_storydedup.py
          python test_feed_gate.py
          python test_regional.py
          python test_live_identity.py
          python test_editor.py
          python test_pipeline_start.py
          python test_editions.py
          python test_twins.py
          python test_home_source.py
          python test_pool_space.py
          python test_native_lang.py
          python test_shelves.py
          python test_intent.py
          python test_country_shelves.py
          python test_dull.py
          python test_curious.py
          python test_negated_keyword.py
          python test_border.py

      - name: Run fetch script
        run: python fetch_news.py

      # ПОЛКИ СТРАН, ТЕНЕВОЙ РЕЖИМ (06.10.2026). Местные новости ~60 стран пулов
      # проходят тот же ИИ-отбор, что и основная лента, и кладутся в /news/country/*.
      # Приложение эти узлы пока НЕ читает: читателям ничего не меняется, пока его не
      # переключат (выпуск 47/48). Ошибка шага ленту не роняет. Расход около $0,04
      # за прогон при тёплой памяти вердиктов, около $0,13 при холодной.
      - name: Полки стран (теневой режим)
        # Раз в сутки (первый слот) и при ручном запуске без списка пулов: ~8 минут и до $0,13
        if: always() && env.COUNTRY_SHELVES == '1'
        continue-on-error: true
        timeout-minutes: 15
        run: python country_shelves.py

      # Разбор ОПУБЛИКОВАННОЙ ленты по всем четырём пулам. Пользователь читает
      # только русский — испанский, португальский и английский не проверял
      # никто, и все находки приходили из одного пула. Проверка идёт после
      # публикации, не роняет прогон при сбое и ничего не стоит: без ИИ
      # Отчёт редактора — вложением к прогону СРАЗУ после сбора ленты. Его
      # можно скачать (gh run download -n editor-report), не дожидаясь конца
      # дозора: лог GitHub до конца задания недоступен, а после отмены
      # дозора однажды пропал целиком; коммит отчёта тоже однажды не дошёл
      - name: Отчёт редактора
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: editor-report
          path: editor_report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit published feed
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Личный чат владельца для служебных оповещений — НЕ читательский
          # канал. Проверка пишет туда, только когда замечаний заметно больше
          # обычного: сообщение «всё как всегда» двадцать четыре раза в сутки
          # перестанут читать ровно к тому дню, когда оно окажется важным.
          # Нет секрета — проверка молчит и работает дальше.
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
        run: python feed_audit.py

      - name: Сохранить отчёты
        if: always()
        continue-on-error: true
        env:
          PROBE_DEPLOY_KEY: ${{ secrets.PROBE_DEPLOY_KEY }}
        run: |
          git config user.name  "ticker-probe"
          git config user.email "noreply@github.com"
          git add editor_report.md border_report.md 2>/dev/null || true
          git diff --cached --quiet && { echo "изменений нет"; exit 0; }
          git commit -m "reports: отчёты прогона $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Между прогонами кто-то мог выложить правки — подтягиваем и
          # пробуем снова, а не роняем ленту из-за журнала замеров
          git pull --rebase --autostash origin main || true
          # В main нельзя пушить без pull request (правило protect-main).
          # Обход у deploy-ключа «ticker-probe», ключ лежит в секрете.
          mkdir -p ~/.ssh
          printf '%s\n' "$PROBE_DEPLOY_KEY" > ~/.ssh/probe_key
          chmod 600 ~/.ssh/probe_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/probe_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push git@github.com:MirlanMMR/ticker247-backend.git HEAD:main \
            || echo "не выложилось, отчёт уйдёт следующим"
          rm -f ~/.ssh/probe_key
