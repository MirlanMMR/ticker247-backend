name: Fetch & AI Filter News

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Учебная тревога: работать через запасного поставщика"
        type: boolean
        default: false
  schedule:
    # Часовой график вернулся 22.08.2026, на неделю раньше срока: минуты
    # Actions стали бесплатными (репозиторий открыт), а прогон стоит 1,9
    # цента — 46 центов в сутки. Ограничение было в минутах, не в деньгах.
    #
    # И это нужно ленте: она стала хронологической, а хронология без свежести
    # бессмысленна — новость двухчасовой давности не должна быть верхней.
    # ДВА запуска в час, а не один. Расписание GitHub Actions — обещание, а
    # не гарантия: замер 27.08.2026 по 38 плановым прогонам дал медиану 59
    # минут, но пять разрывов больше полутора часов и один в 5 ч 14 мин. В ночь
    # на 27-е запуски не состоялись вовсе, и лента стояла девять часов — при
    # том что читателю мы обещаем обновление каждый час.
    #
    # Пропустит GitHub первый запуск — сработает второй. Платить дважды при
    # этом не придётся: скрипт в начале смотрит, когда лента обновлялась, и
    # при свежей выходит сразу (см. _feed_is_fresh).
    - cron: '0 * * * *'
    - cron: '30 * * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Проверки идут ДО прогона: они без сети и ключей, занимают доли секунды,
      # а ломают сборку раньше, чем кривая правка успеет уехать в ленту
      - name: Unit tests
        run: |
          python test_trim.py
          python test_extract.py
          python test_storydedup.py
          python test_feed_gate.py

      - name: Run fetch script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Свой потолок расхода ИИ на месяц, в долларах. Держим ниже остатка
          # на счёте: упершись в него, скрипт перестаёт звать ИИ, но ленту
          # продолжает выпускать на отборе по признакам.
          # $18, поднят с $15 27.08.2026. Расход после перехода на цепочку
          # извлечения — $0.53 в сутки, то есть около $16 за полный месяц:
          # прежний потолок упёрся бы примерно 28 сентября, и лента доработала
          # бы месяц без ИИ — без перевода и обзоров прессы.
          #
          # ИМЕННО $18, А НЕ $20. Собственный потолок Gemini на счёте — $20.
          # Поставить наш на ту же цифру значит лишить его смысла: он сработал
          # бы ровно тогда, когда Google и так перекрывает доступ. Наш стоп-кран
          # должен срабатывать РАНЬШЕ внешнего — тогда лента выходит без ИИ, но
          # выходит, а в логе появляется предупреждение. Два доллара форы — это
          # время заметить и решить, поднимать ли гугловский потолок.
          # Учебная тревога: нулевой потолок заставляет скрипт считать, что
          # Gemini недоступен, и уйти к запасному поставщику. Проверять
          # запасной путь в настоящий сбой — худшее время для проверок
          AI_MONTHLY_BUDGET: ${{ inputs.force_fallback && '0' || '18' }}
          # Запасной поставщик. Ключа пока нет — Alibaba держит новый аккаунт
          # под проверкой службы безопасности (ответ обещают за три дня).
          # Без ключа всё работает как раньше, с ключом — Gemini перестаёт быть
          # единственной точкой отказа.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # Поставщик — Groq, а не Alibaba: у Alibaba для ключа требуют
          # привязать карту, а мы после утечки 18.08 решили карт в облаках
          # без нужды не оставлять. У Groq доступ бесплатный и без карты:
          # 30 запросов в минуту, 14 400 в сутки — для запасного пути, который
          # включается лишь когда молчит Gemini, с запасом.
          # Имя переменной осталось историческим.
          # Поставщик — Groq (G-R-O-Q), console.groq.com. Не xAI и не Alibaba:
          # у первого требуют купить кредиты, у второй привязать карту, а
          # запасной путь такой цены не стоит. У Groq доступ бесплатный и без
          # карты: 30 запросов в минуту, 14 400 в сутки.
          # Названия Grok и Groq различаются одной буквой и по-русски звучат
          # одинаково — 22.08 ключ из-за этого был заведён не у того.
          QWEN_BASE_URL: "https://api.groq.com/openai/v1"
          QWEN_MODEL: "openai/gpt-oss-120b"
          # Ручной запуск делает работу всегда, не глядя на свежесть
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python fetch_news.py

      # Разбор ОПУБЛИКОВАННОЙ ленты по всем четырём пулам. Пользователь читает
      # только русский — испанский, португальский и английский не проверял
      # никто, и все находки приходили из одного пула. Проверка идёт после
      # публикации, не роняет прогон при сбое и ничего не стоит: без ИИ
      - name: Audit published feed
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Личный чат владельца для служебных оповещений — НЕ читательский
          # канал. Проверка пишет туда, только когда замечаний заметно больше
          # обычного: сообщение «всё как всегда» двадцать четыре раза в сутки
          # перестанут читать ровно к тому дню, когда оно окажется важным.
          # Нет секрета — проверка молчит и работает дальше.
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
        run: python feed_audit.py
