name: Fetch & AI Filter News

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Учебная тревога: работать через запасного поставщика"
        type: boolean
        default: false
  schedule:
    # Часовой график вернулся 22.08.2026, на неделю раньше срока: минуты
    # Actions стали бесплатными (репозиторий открыт), а прогон стоит 1,9
    # цента — 46 центов в сутки. Ограничение было в минутах, не в деньгах.
    #
    # И это нужно ленте: она стала хронологической, а хронология без свежести
    # бессмысленна — новость двухчасовой давности не должна быть верхней.
    - cron: '0 * * * *'  # каждый час

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Проверки идут ДО прогона: они без сети и ключей, занимают доли секунды,
      # а ломают сборку раньше, чем кривая правка успеет уехать в ленту
      - name: Unit tests
        run: python test_trim.py

      - name: Run fetch script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Свой потолок расхода ИИ на месяц, в долларах. Держим ниже остатка
          # на счёте: упершись в него, скрипт перестаёт звать ИИ, но ленту
          # продолжает выпускать на отборе по признакам.
          # Поднят с $12 до $15 23.08.2026 продюсерским решением: двухэтапная
          # фильтрация встала в $0.0172 за прогон = $12.4 в месяц, впритык к
          # прежнему потолку. Запас прочности нужнее экономии: упёршись в
          # потолок, скрипт перестаёт звать ИИ, и лента выходит без отбора.
          # Собственный потолок Gemini на счёте — $20, обнуляется 1 сентября.
          # Учебная тревога: нулевой потолок заставляет скрипт считать, что
          # Gemini недоступен, и уйти к запасному поставщику. Проверять
          # запасной путь в настоящий сбой — худшее время для проверок
          AI_MONTHLY_BUDGET: ${{ inputs.force_fallback && '0' || '15' }}
          # Запасной поставщик. Ключа пока нет — Alibaba держит новый аккаунт
          # под проверкой службы безопасности (ответ обещают за три дня).
          # Без ключа всё работает как раньше, с ключом — Gemini перестаёт быть
          # единственной точкой отказа.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # Поставщик — Groq, а не Alibaba: у Alibaba для ключа требуют
          # привязать карту, а мы после утечки 18.08 решили карт в облаках
          # без нужды не оставлять. У Groq доступ бесплатный и без карты:
          # 30 запросов в минуту, 14 400 в сутки — для запасного пути, который
          # включается лишь когда молчит Gemini, с запасом.
          # Имя переменной осталось историческим.
          # Поставщик — Groq (G-R-O-Q), console.groq.com. Не xAI и не Alibaba:
          # у первого требуют купить кредиты, у второй привязать карту, а
          # запасной путь такой цены не стоит. У Groq доступ бесплатный и без
          # карты: 30 запросов в минуту, 14 400 в сутки.
          # Названия Grok и Groq различаются одной буквой и по-русски звучат
          # одинаково — 22.08 ключ из-за этого был заведён не у того.
          QWEN_BASE_URL: "https://api.groq.com/openai/v1"
          QWEN_MODEL: "openai/gpt-oss-120b"
        run: python fetch_news.py

      # Разбор ОПУБЛИКОВАННОЙ ленты по всем четырём пулам. Пользователь читает
      # только русский — испанский, португальский и английский не проверял
      # никто, и все находки приходили из одного пула. Проверка идёт после
      # публикации, не роняет прогон при сбое и ничего не стоит: без ИИ
      - name: Audit published feed
        if: always()
        continue-on-error: true
        run: python feed_audit.py
