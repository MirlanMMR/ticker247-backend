name: Eval event definition

# Ручной запуск: проверка определения «событие» на размеченных заголовках.
# Стоит несколько центов, ленту и базу не трогает.
on:
  workflow_dispatch:
  # Временно: чтобы проверить определение до мержа в main (убрать после)
  push:
    branches: [feat/event-whitelist]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Eval — набор с примерами из определения
        run: python eval_event.py testdata/event_golden.json
      - name: Eval — независимый набор (без совпадений с определением)
        run: python eval_event.py testdata/event_holdout.json
