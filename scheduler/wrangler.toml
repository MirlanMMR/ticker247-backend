# Внешний планировщик ленты Ticker 24/7 (Cloudflare Worker). Развёртывание — scheduler/README.md.
name = "ticker247-scheduler"
main = "worker.js"
compatibility_date = "2026-10-01"

# Один триггер раз в час на :02 (запасные запуски GitHub — :07 и :37). Бесплатный тариф Cloudflare даёт
# не больше пяти cron-триггеров, а слотов 13, поэтому слот выбирает сам воркер по часу UTC (SLOTS в worker.js,
# он совпадает с schedule_pools.SLOTS_UTC — test_schedule.py).
[triggers]
crons = ["2 * * * *"]
