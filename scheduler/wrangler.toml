# Внешний планировщик ленты Ticker 24/7 (Cloudflare Worker). Развёртывание — scheduler/README.md.
name = "ticker247-scheduler"
main = "worker.js"
compatibility_date = "2026-10-01"

# Часы UTC — слоты из schedule_pools.SLOTS_UTC, минута :02 (запасные запуски GitHub — :07 и :37)
[triggers]
crons = [
  "2 5 * * *",
  "2 8 * * *",
  "2 9 * * *",
  "2 12 * * *",
  "2 13 * * *",
  "2 14 * * *",
  "2 15 * * *",
  "2 16 * * *",
  "2 18 * * *",
  "2 19 * * *",
  "2 20 * * *",
  "2 22 * * *",
  "2 23 * * *",
]
